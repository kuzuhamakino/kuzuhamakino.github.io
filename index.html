<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketing Tools Studio ｜ 記事LP・広告制作のための実務ツール</title>
<meta name="description" content="記事LPライター・広告運用者のための実務ツールをつくっています。AdRough Maker（画像指示書作成）、AdSpy（好調記事LP調査）を公開中。" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Marketing Tools Studio" />
<meta property="og:description" content="記事LPライター・広告運用者のための実務ツールをつくっています。" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23161512'/><text x='16' y='23' font-size='20' font-family='serif' fill='%23f3f1ec' text-anchor='middle'>M</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --paper:#f0ede7;
    --ink:#171612;
    --ink-soft:#4a4842;
    --ink-faint:#8b8880;
    --rule:rgba(23,22,18,.14);
    --rule-soft:rgba(23,22,18,.08);
    --accent:#a63f28;          /* 朱 */
    --mincho:"Shippori Mincho",serif;
    --gothic:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--gothic);
    line-height:2;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:clamp(3.5rem,11vw,7rem) clamp(1.4rem,5vw,2rem) 4rem;
  }

  /* ===== 共通ラベル ===== */
  .label{
    display:flex;align-items:center;gap:.85rem;
    font-size:.68rem;font-weight:500;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink-faint);
  }
  .label::after{content:"";flex:1;height:1px;background:var(--rule-soft)}

  /* ===== ヒーロー ===== */
  .hero{margin-bottom:clamp(4rem,11vw,6.5rem)}
  .hero .label{margin-bottom:clamp(2rem,6vw,2.8rem)}
  h1{
    font-family:var(--mincho);
    font-weight:600;
    font-size:clamp(1.6rem,5vw,2.2rem);
    line-height:1.78;
    letter-spacing:.01em;
    margin-bottom:clamp(1.8rem,5vw,2.4rem);
    text-wrap:balance;
    word-break:auto-phrase;
  }
  h1 em{
    font-style:normal;
    position:relative;
    white-space:nowrap;
  }
  h1 em::after{
    content:"";position:absolute;left:0;right:0;bottom:.12em;height:1px;
    background:var(--accent);opacity:.75;
  }
  .lead{
    font-size:.9rem;line-height:2.15;color:var(--ink-soft);
    max-width:30em;
  }
  .meta{
    display:flex;flex-wrap:wrap;gap:.5rem 2rem;
    margin-top:clamp(2rem,6vw,2.6rem);
    padding-top:1.4rem;border-top:1px solid var(--rule-soft);
    font-size:.72rem;letter-spacing:.1em;color:var(--ink-faint);
  }
  .meta b{font-family:var(--mincho);font-size:.9rem;font-weight:600;color:var(--ink);letter-spacing:0}

  /* ===== ツール一覧（エディトリアル・リスト） ===== */
  .list{list-style:none;margin-top:clamp(1.6rem,5vw,2.2rem);border-top:1px solid var(--rule)}
  .row{
    display:grid;
    grid-template-columns:2.6rem 1fr 1.1rem;
    gap:0 1rem;
    align-items:start;
    text-decoration:none;color:inherit;
    padding:clamp(1.7rem,5vw,2.2rem) .2rem;
    border-bottom:1px solid var(--rule);
    position:relative;
    transition:padding-left .5s cubic-bezier(.2,.8,.25,1);
    opacity:0;transform:translateY(14px);
  }
  .row.in{opacity:1;transform:none;transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.25,1),padding-left .5s cubic-bezier(.2,.8,.25,1)}
  .row::before{
    content:"";position:absolute;left:-1.4rem;right:-1.4rem;top:0;bottom:0;
    background:rgba(23,22,18,.028);opacity:0;transition:opacity .45s;pointer-events:none;
  }
  .row:hover::before{opacity:1}
  .row:hover{padding-left:.75rem}

  .idx{
    font-family:var(--mincho);font-size:.8rem;font-weight:400;
    color:var(--ink-faint);letter-spacing:.06em;
    padding-top:.55rem;transition:color .4s;
  }
  .row:hover .idx{color:var(--accent)}

  .head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .nm{
    font-family:var(--mincho);font-size:clamp(1.2rem,3.6vw,1.45rem);
    font-weight:600;letter-spacing:.01em;line-height:1.5;
  }
  .price{
    font-size:.71rem;letter-spacing:.08em;color:var(--ink-soft);
    border:1px solid var(--rule);padding:.15rem .6rem;border-radius:2px;white-space:nowrap;
  }
  .price.beta{color:var(--accent);border-color:rgba(166,63,40,.35)}
  .rl{
    font-size:.76rem;letter-spacing:.06em;color:var(--ink-faint);
    margin-top:.15rem;
  }
  .desc{
    font-size:.855rem;line-height:2.1;color:var(--ink-soft);
    margin-top:1rem;max-width:32em;
  }
  .feats{
    list-style:none;display:flex;flex-wrap:wrap;gap:.3rem .95rem;
    margin-top:.9rem;font-size:.74rem;color:var(--ink-faint);letter-spacing:.04em;
  }
  .feats li{display:flex;align-items:center;gap:.4rem}
  .feats li::before{content:"";width:3px;height:3px;background:var(--ink-faint);border-radius:50%;flex-shrink:0}

  .arw{
    font-family:var(--mincho);font-size:.95rem;color:var(--ink-faint);
    padding-top:.5rem;justify-self:end;
    transition:transform .5s cubic-bezier(.2,.8,.25,1),color .4s;
  }
  .row:hover .arw{transform:translateX(5px);color:var(--accent)}

  .soon{
    padding:clamp(1.7rem,5vw,2.2rem) .2rem;
    border-bottom:1px solid var(--rule);
    font-size:.8rem;color:var(--ink-faint);letter-spacing:.04em;
    display:grid;grid-template-columns:2.6rem 1fr;gap:0 1rem;
  }
  .soon .idx{padding-top:0}

  footer{
    margin-top:clamp(3rem,9vw,4.5rem);
    display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;
    font-size:.72rem;letter-spacing:.09em;color:var(--ink-faint);
  }
  footer a{
    color:var(--ink);text-decoration:none;
    border-bottom:1px solid var(--rule);padding-bottom:.15rem;
    transition:border-color .4s,color .4s;
  }
  footer a:hover{color:var(--accent);border-color:var(--accent)}

  @media (max-width:520px){
    .row,.soon{grid-template-columns:2rem 1fr;gap:0 .8rem}
    .arw{display:none}
    .head{gap:.35rem}
  }
  @media (prefers-reduced-motion:reduce){
    .row{opacity:1;transform:none;transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ ヒーロー ============ -->
  <header class="hero">
    <p class="label">Marketing Tools Studio</p>
    <h1>広告制作の「めんどくさい」を、<em>ツールで消していく。</em></h1>
    <p class="lead">
      記事LPライター・広告運用者・ディレクターのための実務ツールをつくっています。
      現場で自分が困ったことだけを、そのまま形にしています。
    </p>
    <div class="meta">
      <span><b id="n-tools">0</b> tools released</span>
      <span>Web / LP / Ad Creative</span>
      <span>Japan</span>
    </div>
  </header>

  <!-- ============ ツール一覧（JSから描画） ============ -->
  <section>
    <p class="label">Tools</p>
    <ol class="list" id="tools-list"></ol>
  </section>

  <footer>
    <span>© <span id="year"></span> Marketing Tools Studio</span>
    <a href="https://x.com/kikokikokikokk" target="_blank" rel="noopener">𝕏 Contact</a>
  </footer>
</div>

<script>
/* =====================================================================
   ★ツールを追加するときは、下の TOOLS 配列に { } を1つ足すだけ★
     name  : ツール名
     role  : 一言でどんな道具か
     price : 右上に出る価格表示（例: "買い切り 2,980円"）
     beta  : true にすると価格表示が朱色になります（省略可）
     desc  : 説明文
     feats : 機能の箇条書き（配列）
     url   : リンク先
   番号（01, 02…）は自動で振られます。
   新しいものを上に置きたい場合は配列の先頭に追加してください。
   ===================================================================== */
const TOOLS = [
  {
    name: "AdRough Maker",
    role: "記事LPの画像指示書 作成ツール",
    price: "買い切り 2,980円",
    desc: "記事LPの画像指示、毎回ゼロから考えていませんか？画像内容・構図・字幕を整理し、デザイナーにそのまま渡せる指示書を作成できます。",
    feats: ["画像内容・構図の整理", "字幕テキストの指定", "そのまま共有できる指示書"],
    url: "https://resilient-liger-e93769.netlify.app/"
  },
  {
    name: "AdSpy",
    role: "好調な記事LP・漫画LP 調査ツール",
    price: "月 500円 ／ β版",
    beta: true,
    desc: "長期出稿中の「本物の記事LP・漫画LP」を調査。記事LPライター・広告運用者のための競合リサーチツールです。",
    feats: ["LPの全文プレビュー", "掲載サイトの確認", "出稿日数の追跡", "AIによる構成・訴求分析"],
    url: "https://darling-nasturtium-d547d3.netlify.app"
  },
  /* 例）新しいツールを足すときはこの下に貼り付けて中身を書き換える
  {
    name: "ツール名",
    role: "一言説明",
    price: "買い切り 0,000円",
    desc: "説明文をここに。",
    feats: ["機能1", "機能2"],
    url: "https://example.com"
  },
  */
];

/* ---------- 描画 ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.getElementById('tools-list').innerHTML = TOOLS.map((t, i) => `
  <li>
    <a class="row" href="${esc(t.url)}" target="_blank" rel="noopener">
      <span class="idx">${String(i + 1).padStart(2, '0')}</span>
      <div>
        <div class="head">
          <h3 class="nm">${esc(t.name)}</h3>
          ${t.price ? `<span class="price${t.beta ? ' beta' : ''}">${esc(t.price)}</span>` : ''}
        </div>
        <p class="rl">${esc(t.role)}</p>
        <p class="desc">${esc(t.desc)}</p>
        <ul class="feats">${(t.feats||[]).map(f => `<li>${esc(f)}</li>`).join('')}</ul>
      </div>
      <span class="arw">→</span>
    </a>
  </li>
`).join('') + `
  <li class="soon">
    <span class="idx">${String(TOOLS.length + 1).padStart(2, '0')}</span>
    <span>新しいツールを開発中です。</span>
  </li>`;

document.getElementById('n-tools').textContent = TOOLS.length;
document.getElementById('year').textContent = new Date().getFullYear();

/* ---------- スクロールで静かに出現 ---------- */
const io = new IntersectionObserver((es) => {
  es.forEach((e, i) => {
    if (e.isIntersecting) {
      setTimeout(() => e.target.classList.add('in'), i * 120);
      io.unobserve(e.target);
    }
  });
}, { threshold: .12 });
document.querySelectorAll('.row').forEach(r => io.observe(r));
</script>
</body>
</html>
