<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WEBマーケ・ディレクション支援AIツール ｜ プロフィール</title>
<meta name="description" content="記事LPライター・広告運用者のための実務ツールを開発しています。AdRough Maker（画像指示書作成）、AdSpy（好調記事LP調査）を公開中。" />

<!-- OGP（Xでリンクを貼ったときのカード表示） -->
<meta property="og:type" content="website" />
<meta property="og:title" content="WEBマーケ・ディレクション支援AIツール" />
<meta property="og:description" content="記事LPライター・広告運用者のための実務ツールを開発しています。" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#080b16;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.10);
    --text:#f1f5f9;
    --muted:#94a3b8;
    --indigo:#6366f1;
    --pink:#ec4899;
    --gold:#fbbf24;
    --emerald:#10b981;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--text);
    line-height:1.85; letter-spacing:.01em;
    min-height:100vh; overflow-x:hidden;
  }
  /* 背景のグラデーション光 */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(700px circle at 12% -5%, rgba(99,102,241,.28), transparent 60%),
      radial-gradient(600px circle at 92% 8%, rgba(236,72,153,.20), transparent 60%),
      radial-gradient(800px circle at 50% 105%, rgba(16,185,129,.10), transparent 60%);
  }
  .wrap{max-width:760px; margin:0 auto; padding:clamp(2.5rem,7vw,4.5rem) 1.25rem 4rem}

  /* ---------- プロフィール ---------- */
  .avatar{
    width:88px; height:88px; border-radius:26px; margin:0 auto 1.4rem;
    background:linear-gradient(135deg,var(--indigo),var(--pink));
    display:grid; place-items:center; font-size:2.4rem;
    box-shadow:0 12px 40px rgba(99,102,241,.45);
  }
  .profile{text-align:center; margin-bottom:clamp(2.5rem,7vw,3.5rem)}
  .eyebrow{
    display:inline-flex; align-items:center; gap:.45rem;
    font-size:.76rem; font-weight:700; letter-spacing:.06em;
    color:#a5b4fc; background:rgba(99,102,241,.14);
    border:1px solid rgba(99,102,241,.32);
    padding:.35rem .9rem; border-radius:999px; margin-bottom:1.1rem;
  }
  h1{
    font-size:clamp(1.55rem,5.2vw,2.15rem); font-weight:900; line-height:1.45;
    letter-spacing:-.02em; margin-bottom:.9rem;
  }
  .grad{
    background:linear-gradient(100deg,#818cf8,#e879f9 55%,#fbbf24);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .bio{color:var(--muted); font-size:clamp(.9rem,2.6vw,.97rem); max-width:34em; margin:0 auto}
  .socials{display:flex; justify-content:center; gap:.6rem; margin-top:1.5rem; flex-wrap:wrap}
  .social{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.85rem; font-weight:700; color:var(--text); text-decoration:none;
    background:var(--card); border:1px solid var(--line);
    padding:.55rem 1.1rem; border-radius:999px;
    transition:.25s;
  }
  .social:hover{background:rgba(255,255,255,.1); transform:translateY(-2px)}

  /* ---------- セクション見出し ---------- */
  .sec-head{
    display:flex; align-items:center; gap:.8rem; margin:0 0 1.6rem;
  }
  .sec-head h2{font-size:1.05rem; font-weight:800; white-space:nowrap; letter-spacing:.02em}
  .sec-head .rule{flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent)}
  .sec-head .count{font-size:.78rem; color:var(--muted); font-weight:700}

  /* ---------- ツールカード ---------- */
  .tools{display:flex; flex-direction:column; gap:1.1rem}
  .card{
    position:relative; display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:1.5rem 1.4rem;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    transition:transform .3s cubic-bezier(.2,.8,.3,1), border-color .3s, box-shadow .3s;
    overflow:hidden;
    /* 出現アニメーション */
    opacity:0; transform:translateY(18px);
  }
  .card.in{opacity:1; transform:none}
  .card::after{
    content:""; position:absolute; inset:0; border-radius:var(--radius);
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.05));
    opacity:0; transition:opacity .3s;
  }
  .card:hover{transform:translateY(-4px); border-color:rgba(255,255,255,.24); box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .card:hover::after{opacity:1}
  .card-top{display:flex; align-items:flex-start; gap:1rem; margin-bottom:.9rem}
  .icon{
    width:52px; height:52px; border-radius:15px; flex-shrink:0;
    display:grid; place-items:center; font-size:1.55rem;
    background:rgba(255,255,255,.06); border:1px solid var(--line);
  }
  .head-txt{flex:1; min-width:0}
  .name{font-family:"Plus Jakarta Sans","Noto Sans JP",sans-serif; font-size:1.2rem; font-weight:800; line-height:1.35}
  .role{font-size:.79rem; color:var(--muted); font-weight:700; margin-top:.15rem}
  .badges{display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.85rem}
  .badge{font-size:.72rem; font-weight:800; padding:.22rem .68rem; border-radius:999px; white-space:nowrap}
  .b-price{background:rgba(251,191,36,.14); color:var(--gold); border:1px solid rgba(251,191,36,.38)}
  .b-sub{background:rgba(16,185,129,.14); color:#34d399; border:1px solid rgba(16,185,129,.38)}
  .b-beta{background:rgba(236,72,153,.14); color:#f472b6; border:1px solid rgba(236,72,153,.38)}
  .b-tag{background:rgba(255,255,255,.05); color:var(--muted); border:1px solid var(--line)}
  .desc{font-size:.9rem; color:#cbd5e1; margin-bottom:1.1rem}
  .feats{display:flex; flex-wrap:wrap; gap:.4rem .9rem; margin-bottom:1.2rem}
  .feat{font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:.35rem}
  .feat::before{content:"✓"; color:var(--emerald); font-weight:900}
  .cta{
    display:flex; align-items:center; justify-content:space-between; gap:.75rem;
    background:linear-gradient(135deg,var(--indigo),var(--pink));
    color:#fff; font-weight:800; font-size:.92rem;
    padding:.8rem 1.2rem; border-radius:12px;
  }
  .cta .arrow{transition:transform .25s}
  .card:hover .cta .arrow{transform:translateX(5px)}
  .soon{
    text-align:center; border:1px dashed var(--line); color:var(--muted);
    border-radius:var(--radius); padding:1.5rem 1.2rem; font-size:.87rem;
    background:rgba(255,255,255,.015);
  }

  footer{
    margin-top:3.5rem; padding-top:1.8rem; border-top:1px solid var(--line);
    text-align:center; color:#64748b; font-size:.8rem;
  }
  footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line)}

  @media (max-width:480px){
    .card{padding:1.3rem 1.1rem}
    .icon{width:46px;height:46px;font-size:1.35rem;border-radius:13px}
    .name{font-size:1.08rem}
    .cta{font-size:.86rem; padding:.75rem 1rem}
  }
  @media (prefers-reduced-motion:reduce){
    .card{opacity:1; transform:none; transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ プロフィール ============ -->
  <header class="profile">
    <div class="avatar">🛠️</div>
    <span class="eyebrow">WEBマーケ / ディレクション支援ツール開発</span>
    <h1>広告制作の「めんどくさい」を<br /><span class="grad">ツールで消していく。</span></h1>
    <p class="bio">
      記事LPライター・広告運用者・ディレクターのための実務ツールをつくっています。
      現場で自分が困ったことだけを、そのまま形にしています。
    </p>
  </header>

  <!-- ============ ツール一覧（JSから描画） ============ -->
  <section id="tools">
    <div class="sec-head">
      <h2>公開中のツール</h2>
      <span class="rule"></span>
      <span class="count" id="count"></span>
    </div>
    <div class="tools" id="tools-list"></div>
  </section>

  <footer>
    <p>© <span id="year"></span> ｜ お問い合わせは <a href="https://x.com/kikokikokikokk" target="_blank" rel="noopener">𝕏 のDM</a> まで</p>
  </footer>
</div>

<script>
/* =====================================================================
   ★ツールを追加するときは、下の TOOLS 配列に { } を1つ足すだけ★
     icon  : 絵文字アイコン
     name  : ツール名
     role  : 一言でどんな道具か
     badges: [{t:表示文字, c:'price'|'sub'|'beta'|'tag'}]  ← 色が変わります
     desc  : 説明文
     feats : 機能の箇条書き（配列）
     url   : リンク先
     cta   : ボタンの文字
   新しいものを上に置きたい場合は配列の先頭に追加してください。
   ===================================================================== */
const TOOLS = [
  {
    icon: "✏️",
    name: "AdRough Maker",
    role: "記事LPの画像指示書 作成ツール",
    badges: [{t:"買い切り 2,980円", c:"price"}, {t:"指示書作成", c:"tag"}],
    desc: "記事LPの画像指示、毎回ゼロから考えていませんか？画像内容・構図・字幕を整理し、デザイナーにそのまま渡せる指示書を作成できます。",
    feats: ["画像内容・構図の整理", "字幕テキストの指定", "そのまま共有できる指示書"],
    url: "https://resilient-liger-e93769.netlify.app/",
    cta: "AdRough Maker を見る"
  },
  {
    icon: "🔍",
    name: "AdSpy",
    role: "好調な記事LP・漫画LP 調査ツール",
    badges: [{t:"月 500円", c:"sub"}, {t:"β版公開中", c:"beta"}, {t:"競合調査", c:"tag"}],
    desc: "長期出稿中の「本物の記事LP・漫画LP」を調査。記事LPライター・広告運用者のための競合リサーチツールです。",
    feats: ["LPの全文プレビュー", "掲載サイトの確認", "出稿日数の追跡", "AIによる構成・訴求分析"],
    url: "https://darling-nasturtium-d547d3.netlify.app",
    cta: "AdSpy β版を見る"
  },
  /* 例）新しいツールを足すときはこの下に貼り付けて中身を書き換える
  {
    icon: "🚀",
    name: "ツール名",
    role: "一言説明",
    badges: [{t:"買い切り 0,000円", c:"price"}],
    desc: "説明文をここに。",
    feats: ["機能1", "機能2"],
    url: "https://example.com",
    cta: "ツールを見る"
  },
  */
];

/* ---------- 描画 ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list = document.getElementById('tools-list');

list.innerHTML = TOOLS.map(t => `
  <a class="card" href="${esc(t.url)}" target="_blank" rel="noopener">
    <div class="card-top">
      <div class="icon">${esc(t.icon)}</div>
      <div class="head-txt">
        <div class="name">${esc(t.name)}</div>
        <div class="role">${esc(t.role)}</div>
      </div>
    </div>
    <div class="badges">
      ${(t.badges||[]).map(b => `<span class="badge b-${esc(b.c||'tag')}">${esc(b.t)}</span>`).join('')}
    </div>
    <p class="desc">${esc(t.desc)}</p>
    <div class="feats">
      ${(t.feats||[]).map(f => `<span class="feat">${esc(f)}</span>`).join('')}
    </div>
    <div class="cta"><span>${esc(t.cta||'詳しく見る')}</span><span class="arrow">→</span></div>
  </a>
`).join('') + `<div class="soon">🧪 新しいツールを開発中です。追加まで少々お待ちください。</div>`;

document.getElementById('count').textContent = TOOLS.length + ' tools';
document.getElementById('year').textContent = new Date().getFullYear();

/* ---------- スクロールで順に出現 ---------- */
const io = new IntersectionObserver((entries) => {
  entries.forEach((e, i) => {
    if (e.isIntersecting) {
      setTimeout(() => e.target.classList.add('in'), i * 90);
      io.unobserve(e.target);
    }
  });
}, { threshold: .12 });
document.querySelectorAll('.card').forEach(c => io.observe(c));
</script>
</body>
</html>
